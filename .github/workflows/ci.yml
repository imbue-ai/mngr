# Public-mirror CI: lint plus the infrastructure-free test subset.
# GitHub-hosted runners only; no secrets, no self-hosted labels.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check --force-exclude .
      - run: uv run ruff format --check --force-exclude .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      # The restic minds bundles, staged where the minds tests look for it.
      - run: |
          node -e "const b = require('./apps/minds/scripts/download-binaries.js'); b.BINARIES.restic.download('apps/minds/resources', b.getPlatformArch()).catch((e) => { console.error(e); process.exit(1); })"
          apps/minds/resources/restic/restic version
      # --locked also validates the committed public uv.lock against the tree.
      - run: uv sync --locked --all-packages
      # The three --deselect entries fail only in this runner environment;
      # tracked as mngr-internal issues 84 (gcloud contract), 85 (gc chmod
      # injection), 86 (plugin catalog vs installed set).
      - run: just test-quick "-m 'not tmux and not modal and not docker and not docker_sdk and not unison and not acceptance and not release and not minds_deployment and not minds_services and not minds_snapshot_resume and not sdk_live' --deselect libs/mngr_gcp/imbue/mngr_gcp/config_test.py::test_get_gcloud_compute_zone_honors_contract --deselect libs/mngr/imbue/mngr/cli/test_gc.py::test_gc_exits_with_cause_specific_code_when_work_dir_cleanup_fails --deselect libs/mngr/imbue/mngr/plugins/plugin_isolation/no_plugins/no_plugins_test.py::test_all_cataloged_plugins_are_blocked"
        env:
          # Match the job timeout so the pytest global duration guard does not
          # fail a passing-but-slow run.
          PYTEST_MAX_DURATION_SECONDS: "2400"

  # Proves the public-repo developer bootstrap: apps/minds/scripts/install-linux.sh
  # run from a checkout on a stock Ubuntu runner, non-interactively and without
  # Docker (the runner's daemon is not what the script installs), must leave
  # the pinned toolchain, the Electron dependencies, the bundled binaries, and
  # a working `minds run` behind. Anything the script touches is on the public
  # mirror, so this needs no secrets.
  test-minds-linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run the Linux installer from the checkout
        run: apps/minds/scripts/install-linux.sh --yes --no-launch --skip-docker

      - name: Verify the installed toolchain and app
        env:
          NODE_PIN_FILE: apps/minds/.nvmrc
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export NVM_DIR="$HOME/.nvm"
          set +u; . "$NVM_DIR/nvm.sh"; nvm use "$(cat "$NODE_PIN_FILE")" >/dev/null; set -u
          node_pin="v$(tr -d '[:space:]' < "$NODE_PIN_FILE")"
          pnpm_pin="$(node -p "require('./apps/minds/package.json').engines.pnpm")"
          git_pin="$(node -p "require('./apps/minds/scripts/git-manifest.json').gitVersion")"
          test "$(node --version)" = "$node_pin"
          test "$(cd apps/minds && pnpm --version)" = "$pnpm_pin"
          test -x apps/minds/node_modules/.bin/electron
          test -x "$HOME/.local/bin/minds-desktop"
          apps/minds/resources/git/bin/git --version | tee /dev/stderr | grep -F "git version $git_pin"
          test -f apps/minds/imbue/minds/desktop_client/static/ui/.vite/manifest.json
          uv run minds run --help
