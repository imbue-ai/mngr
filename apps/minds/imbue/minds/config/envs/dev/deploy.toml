# Dev tier deploy config -- read by `minds-admin env deploy` for any dev env.
#
# `modal_workspace` is the dev tier's Modal workspace. The dev tier has
# no shared Modal environment of its own -- every dev iterates against
# a *per-developer* Modal environment that takes the activated dev env's
# name. The `modal_env` field below is unused for dev-tier deploys:
# `minds-admin env deploy` (with a dev env activated) always pins the Modal
# env to the activated dev env name. Staging / production deploys are
# the ones that consume `modal_env`; we leave it at its default ("main")
# for shape consistency.

modal_workspace = "minds-dev"
vault_path_prefix = "secrets/minds/dev"
cloudflare_domain = "minds-dev.com"

# Vault-backed per-env Modal Secrets. Each name corresponds to a
# Vault entry at `<vault_path_prefix>/<name>` -- the deploy reads that
# entry, adds any deploy-time-computed overrides (URLs, DSNs, app
# ids), and pushes the merged dict as Modal Secret
# `<name>-<tier>-<deploy_id>`. The `litellm-connector` Modal Secret
# is NOT vault-backed; the deploy pushes it as a separately-named
# step with values derived entirely at deploy time (LITELLM_PROXY_URL,
# LITELLM_MASTER_KEY from the `litellm` secret, MINDS_TIER_GENERATION_ID,
# MINDS_ENV_NAME).
[secrets]
services = [
    "cloudflare",
    "litellm",
    "neon",
    "pool-ssh",
    "supertokens",
    "sharing",
    "storage",
    "sentry",
    "ssh-ca",
]

# Dev envs keep no warm containers (min_containers defaults to 0), so without
# this every request after ~60s idle pays a cold boot. Hold containers for
# ~10 minutes after the last request so a dev session stays hot. The ci tier
# deliberately omits this block (0 = Modal default) so test containers tear
# down promptly; staging/production also omit it and rely on min_containers=1.
[scaledown_window]
connector = 600
litellm_proxy = 600

# The tier's SSH certificate authority (imbue-ai/mngr-internal#850): the public
# half of the Vault ``minds-dev-ssh`` mount's CA, which every gen-2 box, slice VM,
# and workspace container trusts for management SSH instead of a static key.
# Read with
#   vault read -field=public_key minds-dev-ssh/config/ca
# after the Vault bring-up (imbue-ai/vault terraform, applied 2026-09-09).
# Rotating the CA means re-prepping every gen-2 box and re-baking every slice
# on the tier before updating this value (see docs/deploy/setup/vault.md).
[ssh_ca]
public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICDn/NBtT5XWAmOSPj2S6kXsvEPAoORm1x3ZSkRIX+XW minds-dev-ssh-ca"

# The tier's gen-2 management plane (specs/slice-fleet-gen2, phase 3; runbook:
# apps/minds/docs/deploy/gen2-management-plane.md). Every value here is PUBLIC
# (operator WireGuard public keys, the tier's Modal Proxy name and static
# egress IPs), so peer and allowlist changes are ordinary PR-reviewed edits.
# The matching private halves never leave their machines: each operator
# generates their own keypair locally into their per-tier identity directory
# (`wg genkey | tee ~/.mindsadmin/dev/wireguard.key | wg pubkey`) and each
# box generates its own at prep.
#
# Addressing plan (MANAGEMENT_OVERLAY_CIDR_BY_TIER in the minds config; every
# tier gets a disjoint carve of the reserved 10.64.0.0/10 supernet, so one
# operator machine can hold several tiers' tunnels at once). The dev tier's
# overlay is 10.112.0.0/16:
#   - operators: 10.112.0.2 - 10.112.0.254, assigned by hand in this table;
#   - boxes: 10.112.1.1 upward, assigned sequentially at `minds-admin server
#     prep` and stamped on the bare_metal_servers row (`wireguard_address`).
#
# The box `:22` lockdown is applied by gen-2 prep ONLY when
# [management_plane.modal_proxy] is configured below -- without it the
# connector would have no allowlisted egress address and every workspace on
# the box would break. All dev envs share this one table (and the minds-dev
# workspace's single proxy). A tier without a [management_plane] table has no
# management plane yet.
[management_plane.wireguard]
listen_port = 51820

# One block per operator.

# Josh's operator key. The private half lives on Josh's dev box at
# ~/.mindsadmin/dev/wireguard.key (generated during the gen-2 canary activation).
[[management_plane.wireguard.operators]]
name = "josh"
public_key = "GbBZ3zKqhQYW8R9nbYrV1le0S10KxLT4KqPcRp2r5QI="
address = "10.112.0.2"

# The tier's Modal Proxy: created once in the minds-dev Modal workspace,
# named here with its static egress IPs. Proxy lookup is Modal-environment
# scoped and the workspace holds at most one proxy, so the shared dev proxy
# lives in the 'main' environment and every dev env resolves it there.
[management_plane.modal_proxy]
proxy_name = "minds-dev-connector"
environment_name = "main"
static_ips = ["34.239.15.6"]

# Tier-shape flags consumed by `minds-admin env deploy` / `destroy`. All four
# are required (no defaults) so a misconfigured tier fails fast on load.
[lifecycle]
creates_resources = true
modal_env_strategy = "PER_ENV"
writes_local_state = true
tracks_generation = false

# Workspace stop/start knobs stamped over the Vault ``storage`` entry at
# deploy time. Dev envs keep the retention window (halted local VM held for
# instant restart-in-place before the slot is freed) short so stop/start
# iteration and the opt-in release test see the retention finalize land in
# minutes; production/staging keep the default hour.
[storage]
stop_retention_seconds = 300

# Default paid-access entries seeded (seed-if-absent) into the connector's
# paid_domains table after migrations, so the imbue team can use paid features
# (host pool, LiteLLM keys, R2 buckets) on a fresh env without manual setup.
[paid]
domains = ["imbue.com"]

# Plan definitions written (overwriting) into the connector's plans table on
# every deploy -- git is the source of truth for plan defaults. Existing
# per-user entitlement rows (copied from a plan at assignment) are never
# touched by this; adjust individual users via
# `minds-admin account set-plan / set-quota`. The same values are
# committed for every tier; tests that need small limits override per-user
# via the admin API.
[plans.free]
max_remote_workspaces = 1
max_total_workspaces = 5
max_buckets = 5
max_total_bucket_gb = 25
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200
max_active_machine_units = 8
max_total_machine_disk_gb = 140

[plans.explorer]
max_remote_workspaces = 2
max_total_workspaces = 10
max_buckets = 5
max_total_bucket_gb = 50
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200
max_active_machine_units = 16
max_total_machine_disk_gb = 280

[plans.ally]
max_remote_workspaces = 10
max_total_workspaces = 50
max_buckets = 20
max_total_bucket_gb = 500
monthly_llm_spend_usd = 1000
max_active_synced_workspaces = 200
max_active_machine_units = 80
max_total_machine_disk_gb = 1400

# Enables browser-driven workspace creation (the connector's POST
# /hosts/claim). The repo is the canonical host/org/repo key the pool bake
# stamps into row attributes. The template REF is deliberately not committed
# here: web creates lease only exact matches, so a committed ref silently
# goes stale the moment the dev pool is re-baked at a newer version. Every
# dev-tier deploy must instead state the ref explicitly, matching what the
# dev pool is baked at (see `just pool-bake-from-worktree` / `pool-bake`):
#   MINDS_WEB_TEMPLATE_REF=<branch-or-tag> uv run minds-admin env deploy
[web_workspaces]
template_repo = "github.com/imbue-ai/default-workspace-template"

# Whether this tier deploys the analytics app (analytics-<tier>): the
# gold-table aggregation + lake maintenance crons. Off until the tier's
# analytics bringup (apps/analytics/docs/bringup.md) has provisioned the
# Neon project, R2 buckets, and Vault entry. Dev envs can opt in per-env
# with the sticky `minds env deploy --with-analytics` flag.
[analytics]
is_deployed = false
