# Staging tier deploy config -- read by deploy scripts.

modal_workspace = "minds-staging"
vault_path_prefix = "secrets/minds/staging"
cloudflare_domain = "minds-staging.com"

# Vault-backed per-env Modal Secrets (see dev/deploy.toml for the
# full explanation). The `litellm-connector` Modal Secret is pushed
# separately by the deploy code and intentionally does not appear
# here.
[secrets]
services = [
    "cloudflare",
    "litellm",
    "neon",
    "pool-ssh",
    "supertokens",
    "sharing",
    "storage",
    "sentry",
]

[lifecycle]
creates_resources = false
modal_env_strategy = "SHARED"
writes_local_state = false
tracks_generation = true

[min_containers]
# Keep one container of each app warm so the desktop client never pays
# a cold-boot penalty on auth / lease / share hits.
connector = 1
litellm_proxy = 1

# Default paid-access entries seeded (seed-if-absent) into paid_domains after
# migrations, so the imbue team can exercise paid features on staging.
[paid]
domains = ["imbue.com"]

# Plan definitions written (overwriting) into the connector's plans table on
# every deploy -- git is the source of truth for plan defaults. Existing
# per-user entitlement rows (copied from a plan at assignment) are never
# touched by this; adjust individual users via
# `minds-admin account set-plan / set-quota`. The same values are
# committed for every tier; tests that need small limits override per-user
# via the admin API.
[plans.free]
max_remote_workspaces = 1
max_total_workspaces = 5
max_buckets = 5
max_total_bucket_gb = 25
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200

[plans.explorer]
max_remote_workspaces = 2
max_total_workspaces = 10
max_buckets = 5
max_total_bucket_gb = 50
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200

[plans.ally]
max_remote_workspaces = 10
max_total_workspaces = 50
max_buckets = 20
max_total_bucket_gb = 500
monthly_llm_spend_usd = 1000
max_active_synced_workspaces = 200

# Enable web workspace creation (the hosted chrome's POST /hosts/claim).
# Deliberately unadvertised for now: only people who know the /web URL use it.
# No explicit pins: the template repo/ref default to the canonical
# default-workspace-template repo and the app's pinned release tag
# (FALLBACK_BRANCH in imbue/minds/build_info.py), so the web pin advances with
# each release automatically -- the same tag the pool is re-baked from.
# Deploy-time env vars MINDS_WEB_TEMPLATE_REPO / MINDS_WEB_TEMPLATE_REF
# override for one-off deploys.
[web_workspaces]

# User-facing custom-domain origin layout (sharing redesign): the hosted
# accounts surface and the web chrome are Modal custom domains on the
# connector, sharing one browser session via a cookie scoped to the apex.
# The apex is first-party only -- untrusted workspace content lives on the
# separate content domain (minds-staging.com) -- and is staging's own, so
# sessions can never cross tiers. Both hosts must be registered and verified
# in the minds-staging Modal workspace (dashboard -> Domains) BEFORE deploying
# with this block, or the deploy fails.
[origins]
accounts_origin = "https://accounts.imbue-staging.com"
chrome_origin = "https://minds.imbue-staging.com"
cookie_domain = "imbue-staging.com"

# Whether this tier deploys the analytics app (analytics-<tier>): the
# gold-table aggregation + lake maintenance crons. Staging's bringup
# (apps/analytics/docs/bringup.md) ran 2026-08-26: the analytics-staging
# Neon project, R2 buckets/tokens, reader role, and Vault entry all exist,
# and the app is deployed -- so unified deploys must keep maintaining it.
[analytics]
is_deployed = true
