# Production tier deploy config -- read by deploy scripts.
#
# Names the Modal workspace, the Vault path prefix for this tier, and the
# list of services whose `.minds/template/<service>.sh` schemas must be
# pulled from Vault and pushed into Modal as `<service>-production`.

modal_workspace = "minds-production"
vault_path_prefix = "secrets/minds/production"
cloudflare_domain = "imbueminds.com"

# Every service named here must exist as `.minds/template/<service>.sh`
# (the schema) AND have a corresponding Vault entry at
# `<vault_path_prefix>/<service>` containing every key the schema declares.
# The `litellm-connector` Modal Secret is NOT vault-backed; the deploy
# pushes it as a separately-named step with values derived entirely at
# deploy time. See dev/deploy.toml for the full explanation.
[secrets]
services = [
    "cloudflare",
    "litellm",
    "neon",
    "pool-ssh",
    "supertokens",
    "sharing",
    "storage",
    "sentry",
    "ssh-ca",
]

# The tier's SSH certificate authority (imbue-ai/mngr-internal#850): the public
# half of the Vault ``minds-production-ssh`` mount's CA, which every gen-2 box, slice VM,
# and workspace container trusts for management SSH instead of a static key.
# Read it after the Vault bring-up (imbue-ai/vault terraform) with
#   vault read -field=public_key minds-production-ssh/config/ca
# and commit it here. Until this block exists, gen-2 box prep and slice bakes
# on the tier refuse. Committed 2026-09-15 for the production gen-2 bring-up.
[ssh_ca]
public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOHB7JldbVagXungZpZuIqIocRiYZLfTFuLDJ0VTwVMG minds-production-ssh-ca"

# The tier's gen-2 management plane (operator WireGuard peers + the Modal Proxy
# whose static IPs the box `:22` lockdown allowlists; runbook:
# apps/minds/docs/deploy/gen2-management-plane.md). Every value here is PUBLIC.
# The production overlay is 10.64.0.0/11 (MANAGEMENT_OVERLAY_CIDR_BY_TIER):
# operators 10.64.0.2 - 10.64.0.254, boxes from 10.64.1.1 upward (assigned at
# `minds-admin server prep`). The `:22` lockdown lands on a gen-2 box only when
# [management_plane.modal_proxy] is configured; gen-1 boxes are never locked.
# Committed ahead of the production connector deploy that will attach the
# proxy; no production box is gen-2 yet, so nothing is locked down until the
# first gen-2 prep there.
[management_plane.wireguard]
listen_port = 51820

# Josh's operator key. The private half lives on Josh's dev box at
# ~/.mindsadmin/production/wireguard.key (generated 2026-09-13).
[[management_plane.wireguard.operators]]
name = "josh"
public_key = "sKtd/fSa3DfKcluRhv3ial/nShb4MUiKOfvGkmkyrWU="
address = "10.64.0.2"

# Gabriel's operator key (the private half lives on his machine at
# ~/.mindsadmin/production/wireguard.key; the same keypair as his dev and
# staging entries).
[[management_plane.wireguard.operators]]
name = "gabriel"
public_key = "Ux1S91tQAYjU5lMVdc7ab7dGFebbziqFwiCvvfQfvCw="
address = "10.64.0.3"

# The tier's Modal Proxy: created 2026-09-13 in the minds-production Modal
# workspace's 'main' environment, in Modal's us-east region.
[management_plane.modal_proxy]
proxy_name = "mind-connector-east"
environment_name = "main"
static_ips = ["52.206.40.121"]

# Tier-shape flags consumed by `minds-admin env deploy` / `destroy`. Production
# tracks generation for parity with staging (production destroy is hard-
# refused at the CLI today, so the id is effectively immutable for the
# lifetime of the tier).
[lifecycle]
creates_resources = false
modal_env_strategy = "SHARED"
writes_local_state = false
tracks_generation = true

# Workspace stop/start knob stamped over the Vault ``storage`` entry at deploy
# time: how long a stopped workspace's halted VM lingers on its box for an
# instant restart in place before the retention finalize frees the slot. The
# window is a latency optimization only (the durable artifact is verified
# before the row reaches stopped), so ten minutes covers the stop-then-restart
# and restart-for-resize flows without pinning a slot per stopped workspace for
# the connector's default hour, or holding a drained box for an hour before it
# can be repaved. Takes effect at the next production connector deploy.
[storage]
stop_retention_seconds = 600

# Per-app warm-pool sizes. Keep containers alive so the desktop client never
# pays a cold-boot penalty on auth / lease / share hits. The connector keeps
# two so that one container being recycled (a redeploy, a worker event) is
# never the whole fleet: every share relay's frps heartbeat auth goes through
# it.
[min_containers]
connector = 2
litellm_proxy = 1

# Idle seconds before the autoscaler retires a container it added for a
# burst. Modal's default retires it between two bursts with requests still in
# flight; ten minutes lets it ride out the quiet spell instead.
[scaledown_window]
connector = 600
litellm_proxy = 600

# Default paid-access entries seeded (seed-if-absent) into paid_domains after
# migrations, so the imbue team can exercise paid features on production.
[paid]
domains = ["imbue.com"]

# Plan definitions written (overwriting) into the connector's plans table on
# every deploy -- git is the source of truth for plan defaults. Existing
# per-user entitlement rows (copied from a plan at assignment) are never
# touched by this; adjust individual users via
# `minds-admin account set-plan / set-quota`. The same values are
# committed for every tier; tests that need small limits override per-user
# via the admin API.
[plans.free]
max_remote_workspaces = 1
max_total_workspaces = 5
max_buckets = 5
max_total_bucket_gb = 25
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200
max_active_machine_units = 8
max_total_machine_disk_gb = 140

[plans.explorer]
max_remote_workspaces = 2
max_total_workspaces = 10
max_buckets = 5
max_total_bucket_gb = 50
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200
max_active_machine_units = 16
max_total_machine_disk_gb = 280

[plans.ally]
max_remote_workspaces = 10
max_total_workspaces = 50
max_buckets = 20
max_total_bucket_gb = 500
monthly_llm_spend_usd = 1000
max_active_synced_workspaces = 200
max_active_machine_units = 80
max_total_machine_disk_gb = 1400

# Enable web workspace creation (the hosted chrome's POST /hosts/claim).
# Deliberately unadvertised for now: only people who know the /web URL use it.
# No explicit pins: the template repo defaults to the canonical
# default-workspace-template repo. The live template ref is the release feed's
# `<channel>-web.json` (this tier's client.toml names the feed; the entries live
# in apps/minds/release-channels.toml [web_channels.*]), read by the connector
# on every web create, so a promotion moves it without a deploy. The
# deploy-time ref (the app's pinned release tag, FALLBACK_BRANCH in
# imbue/minds/build_info.py) is the fallback for when the feed cannot be read.
# Deploy-time env vars MINDS_WEB_TEMPLATE_REPO / MINDS_WEB_TEMPLATE_REF
# override for one-off deploys.
[web_workspaces]

# User-facing custom-domain origin layout (sharing redesign): the hosted
# accounts surface and the web chrome are Modal custom domains on the
# connector, sharing one browser session via a cookie scoped to the apex.
# The apex is first-party only -- untrusted workspace content lives on the
# separate content domain (imbueminds.com); policy: user content never gets
# an imbue.com hostname. Both hosts must be registered and verified in the
# minds-production Modal workspace (dashboard -> Domains) BEFORE deploying
# with this block, or the deploy fails.
[origins]
accounts_origin = "https://accounts.imbue.com"
chrome_origin = "https://minds.imbue.com"
cookie_domain = "imbue.com"

# Whether this tier deploys the analytics app (analytics-<tier>): the
# gold-table aggregation + lake maintenance crons. Production's bringup
# (apps/analytics/docs/bringup.md) ran 2026-08-26: the analytics-production
# Neon project, R2 buckets/tokens, reader role, and Vault entry all exist,
# and the app is deployed -- so unified deploys must keep maintaining it.
[analytics]
is_deployed = true
