# Production tier client config -- read by `minds run`.
#
# Contains only the URLs the desktop client itself talks to; no secrets.
# Operators populate these values once new production infra (Modal account,
# remote_service_connector, litellm-proxy) is stood up. Until then, the
# values here may temporarily point at older infra during cutover.

# The api and llm custom domains from deploy.toml's [origins] block. The
# *.modal.run URLs they front stay attached for the binaries that carry them.
connector_url = "https://api.studio.imbue.com"
litellm_proxy_url = "https://llm.studio.imbue.com"

# The accounts host shared-workspace visitor links point at (a Modal custom
# domain on the connector app; see the [origins] block in deploy.toml).
accounts_base_url = "https://accounts.imbue.com"

# Serves the release-channel manifests that the desktop app reads.
# Example: https://updates.imbueminds.com/alpha-mac.yml
# Absent means the app falls back to ToDesktop's own feed and offers stable only.
#
# Bare hostname on purpose -- this URL is compiled into every shipped binary and
# can never change without stranding installs that already have it.
update_feed_base_url = "https://updates.imbueminds.com"
