# CI tier deploy config -- read by `minds-admin env deploy` for any ci env.
#
# Mirrors the dev tier today: every CI env is dynamic (a per-test
# ``ci-<timestamp>-<uuid>`` env stood up by the deployment-tests
# orchestrator) and gets its own Modal environment named after the
# env. The Vault prefix is its own ``secrets/minds/ci`` namespace --
# currently mirrored from ``secrets/minds/dev`` so the two tiers
# share credentials, but kept as a separate namespace so we can
# diverge later without churning the test scaffolding.

modal_workspace = "minds-dev"
vault_path_prefix = "secrets/minds/ci"
cloudflare_domain = "minds-dev.com"

# Vault-backed per-env Modal Secrets. Same shape as dev: each name
# corresponds to a Vault entry at ``<vault_path_prefix>/<name>``.
[secrets]
services = [
    "cloudflare",
    "litellm",
    "neon",
    "pool-ssh",
    "supertokens",
    "sharing",
    "storage",
    "sentry",
]

# Tier-shape flags consumed by `minds-admin env deploy` / `destroy`. Matches
# the dev tier: every CI env is dynamic, creates its own resources,
# writes per-env local state, and does not track a per-tier generation
# id (each env is independent).
[lifecycle]
creates_resources = true
modal_env_strategy = "PER_ENV"
writes_local_state = true
tracks_generation = false

# Workspace stop/start knobs stamped over the Vault ``storage`` entry at
# deploy time. CI envs keep the retention window (halted local VM held for
# instant restart-in-place before the slot is freed) short: the stop/start
# tests must see the retention finalize land in minutes, and nothing in CI
# ever wants an hour-long instant-restart window.
[storage]
stop_retention_seconds = 60

# Default paid-access entries seeded (seed-if-absent) into paid_domains after
# migrations, so CI / deployment-test envs can exercise paid features.
[paid]
domains = ["imbue.com"]

# Plan definitions for CI / deployment-test envs -- same values as the real
# tiers so quota behavior under test matches production; tests that need
# small limits override per-user via the admin API.
[plans.free]
max_remote_workspaces = 1
max_total_workspaces = 5
max_buckets = 5
max_total_bucket_gb = 25
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200

[plans.explorer]
max_remote_workspaces = 2
max_total_workspaces = 10
max_buckets = 5
max_total_bucket_gb = 50
monthly_llm_spend_usd = 0
max_active_synced_workspaces = 200

[plans.ally]
max_remote_workspaces = 10
max_total_workspaces = 50
max_buckets = 20
max_total_bucket_gb = 500
monthly_llm_spend_usd = 1000
max_active_synced_workspaces = 200

# Whether this tier deploys the analytics app (analytics-<tier>): the
# gold-table aggregation + lake maintenance crons. Off until the tier's
# analytics bringup (apps/analytics/docs/bringup.md) has provisioned the
# Neon project, R2 buckets, and Vault entry. Dev envs can opt in per-env
# with the sticky `minds env deploy --with-analytics` flag.
[analytics]
is_deployed = false
