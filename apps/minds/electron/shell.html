<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Loading / quitting / error takeover screen: a white page carrying the
       lockup. On an installation's first launch (loaded with the #intro hash)
       the page plays the intro -- the lockup resolves, two lines fade in and
       out, the lockup travels up to where the app's start route will hold it.
       Every later launch opens on that parked state at once. */
    :root {
      /* The SPA's --c-success green, duplicated because the shell shares no
         stylesheet with it. */
      --brand: #0c8106;
      --ink: #000000;
      --ink-secondary: rgb(0 0 0 / 0.65);
      --ink-tertiary: rgb(0 0 0 / 0.45);
      --surface: #ffffff;
      --fill-subtle: rgb(0 0 0 / 0.04);
      --fill-hover: rgb(0 0 0 / 0.06);
      --border-default: rgb(0 0 0 / 0.17);
      /* The two intro lines are the only serif on the page; the family is a
         single knob so a licensed face can be swapped in later. */
      --intro-serif: Georgia, "Times New Roman", serif;
      /* The titlebar band the SPA's start route parks the mark in: 38px tall
         with a 16px mark centered in it. */
      --titlebar-height: 38px;
      --parked-mark-height: 16px;
      /* The intro's durations and curves (--lockup-delay, --lockup-focus,
         --line-fade, --line-ease, --line-out) and the two blurs (--em-blur,
         --line-out-blur) are set by the script from intro-timing.js, which
         owns every number the film is cut to. */
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--surface);
      color: var(--ink);
      position: relative;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
      container-type: inline-size;
    }

    /* The intro layer: the lockup and the lines, stacked in the middle of the
       page. Present only while the intro plays. The body is a drag region, and
       a drag region swallows every mouse event, so the layer opts out: a click
       anywhere during the film has to reach the skip listener. */
    #intro {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 2cqw;
      -webkit-app-region: no-drag;
    }
    body.intro #intro { display: flex; }
    /* The lockup as drawn (577 x 139), 32% of the page wide. The wrapper keeps
       the aspect ratio so its box is right before the image has loaded, and it
       is the element that travels: the image inside only ever resolves. */
    .lockup-travel {
      width: 32cqw;
      aspect-ratio: 577 / 139;
      transform-origin: top center;
    }
    .lockup {
      display: block;
      width: 100%;
      animation: lockup-focus var(--lockup-focus) cubic-bezier(0, 0.55, 0.45, 1) var(--lockup-delay) both;
    }
    @keyframes lockup-focus {
      from { opacity: 0; filter: blur(1.25cqw); transform: scale(0.98); }
      to { opacity: 1; filter: blur(0); transform: scale(1); }
    }
    /* Every line sits in the same grid cell, so one leaves while the next
       arrives in the same place with nothing reflowing. */
    .lines {
      margin-top: 2.5cqw;
      display: grid;
      justify-items: center;
    }
    .line {
      grid-column: 1;
      grid-row: 1;
      font-family: var(--intro-serif);
      font-size: 2.5cqw;
      line-height: 1;
      white-space: pre;
      color: var(--brand);
      animation: line-out var(--line-out) ease-out var(--line-out-delay) both;
    }
    .line em { font-style: italic; }
    /* The line arrives whole: every run starts together on the lockup's own
       curve, so the words fade up as one piece of type rather than a wave. */
    .run {
      opacity: 0;
      animation: run-in var(--line-fade) var(--line-ease) var(--line-in-delay) both;
    }
    /* An emphasised run also comes into FOCUS, the same move the lockup makes
       above it, so the sharpening lands on exactly the words the line is
       about. The blur is on the run, not its characters: the italic phrase
       resolves as one piece of type. The single duration, easing and delay
       set above apply to both names. */
    em.run {
      animation-name: run-in, em-focus;
    }
    @keyframes run-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes em-focus {
      from { filter: blur(var(--em-blur)); }
      to { filter: blur(0); }
    }
    /* A line that has been read leaves whole, rising and blurring as it
       fades, so it goes the way the mark came.

       The explicit `from` is load-bearing: a keyframe with an implicit start
       and a var() in its end is dropped whole by Chrome. */
    @keyframes line-out {
      from { opacity: 1; transform: translateY(0); filter: blur(0); }
      to { opacity: 0; transform: translateY(-3px); filter: blur(var(--line-out-blur)); }
    }

    /* The parked mark: the same drawing at the size and place the SPA's start
       route holds it, so the hand-off between documents is a substitution. */
    #parked-mark {
      display: none;
      position: absolute;
      top: calc((var(--titlebar-height) - var(--parked-mark-height)) / 2);
      left: 50%;
      transform: translateX(-50%);
      height: var(--parked-mark-height);
      width: auto;
    }
    body.parked #parked-mark { display: block; }

    /* The status block: what the startup sequence is doing, under an
       indeterminate bar. Hidden until the intro is over. */
    #status-block {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      animation: status-in 250ms ease-out both;
    }
    body.parked #status-block { display: flex; }
    body.error #status-block { display: none; }
    @keyframes status-in { to { opacity: 1; } }
    .progress {
      width: 180px;
      height: 3px;
      border-radius: 2px;
      background: var(--fill-subtle);
      overflow: hidden;
      position: relative;
    }
    .progress::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      border-radius: 2px;
      background: var(--ink-tertiary);
      animation: progress-slide 1400ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes progress-slide {
      to { left: 100%; }
    }
    .status {
      font-size: 13px;
      color: var(--ink-secondary);
      min-height: 18px;
      text-align: center;
    }
    /* The startup console log, closed by default under the status line; the
       bar and the phase label say enough for most launches. Sized so the
       parked mark and the bar stay where they are when it opens. */
    #startup-log-toggle { margin-bottom: 0; }
    #startup-log {
      max-width: min(640px, calc(100vw - 48px));
      max-height: min(240px, 40vh);
      margin-top: 0;
      text-align: left;
    }
    /* A committed quit hides the bar and the log: nothing is being waited for,
       only reported. */
    body.quitting .progress,
    body.quitting #startup-log-toggle,
    body.quitting #startup-log { display: none; }

    /* Error state: a takeover with the parked mark still up top. */
    #error-view {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    body.error #error-view { display: flex; }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .message {
      font-size: 14px;
      color: var(--ink-secondary);
      margin-bottom: 24px;
      max-width: 400px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      -webkit-app-region: no-drag;
    }
    .actions button {
      padding: 8px 20px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary { background: var(--ink); color: var(--surface); }
    .btn-primary:hover { opacity: 0.8; }
    .btn-secondary { background: transparent; color: var(--ink); border-color: var(--border-default); }
    .btn-secondary:hover { background: var(--fill-hover); }
    .toggle-details {
      background: none;
      border: none;
      color: var(--ink-secondary);
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 12px;
      -webkit-app-region: no-drag;
    }
    .toggle-details:hover { color: var(--ink); }
    .details {
      display: none;
      width: 100%;
      max-width: 600px;
      max-height: 200px;
      overflow: auto;
      background: var(--fill-subtle);
      border-radius: 8px;
      padding: 16px;
      font-family: "SF Mono", "Fira Code", Menlo, monospace;
      font-size: 12px;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-all;
      -webkit-app-region: no-drag;
      user-select: text;
    }
    .details.visible { display: block; }
    /* One-shot report outcome (shown when the backend is down and we report the
       on-screen error directly via the main-process Sentry). */
    #report-result {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--ink-secondary);
      -webkit-app-region: no-drag;
    }
    #report-result.visible { display: flex; }
    #report-result code {
      font-family: "SF Mono", "Fira Code", Menlo, monospace;
      background: var(--fill-subtle);
      color: var(--ink);
      border-radius: 4px;
      padding: 2px 6px;
      user-select: text;
    }
    #report-copy-btn {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      cursor: pointer;
    }
    #report-copy-btn:hover { background: var(--fill-hover); }
  </style>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="lockup-travel" id="lockup-travel">
      <img class="lockup" id="lockup" src="assets/mind-wordmark.svg" alt="mind" draggable="false">
    </div>
    <div class="lines" id="lines"></div>
  </div>
  <img id="parked-mark" src="assets/mind-wordmark.svg" alt="mind" draggable="false">
  <div id="status-block">
    <div class="progress" aria-hidden="true"></div>
    <div class="status" id="status-line"></div>
    <button class="toggle-details" id="startup-log-toggle" type="button">Show details</button>
    <pre class="details" id="startup-log"></pre>
  </div>
  <div id="error-view">
    <h1>Something went wrong</h1>
    <p class="message" id="error-message">Mind stopped unexpectedly.</p>
    <div class="actions">
      <button class="btn-primary" id="retry-btn">Retry</button>
      <button class="btn-secondary" id="report-btn">Report a bug</button>
      <button class="btn-secondary" id="log-btn">View full log</button>
    </div>
    <div id="report-result">
      <span id="report-result-text"></span>
      <code id="report-event-id"></code>
      <button id="report-copy-btn" type="button">Copy</button>
    </div>
    <button class="toggle-details" id="toggle-details-btn">Show details</button>
    <pre class="details" id="error-details"></pre>
  </div>

  <script src="intro-timing.js"></script>
  <script src="startup-log.js"></script>
  <script>
    var statusLine = document.getElementById('status-line');
    var startupLog = document.getElementById('startup-log');
    var startupLogToggle = document.getElementById('startup-log-toggle');
    var startupLogLines = [];

    // The full startup console output, behind "Show details". Every line the
    // main process forwards lands here whether or not the log is open, so
    // opening it shows what already happened, scrolled to the newest line.
    function renderStartupLog() {
      startupLog.textContent = startupLogLines.join('\n');
      if (startupLog.classList.contains('visible')) startupLog.scrollTop = startupLog.scrollHeight;
    }
    startupLogToggle.addEventListener('click', function() {
      startupLog.classList.toggle('visible');
      this.textContent = startupLog.classList.contains('visible') ? 'Hide details' : 'Show details';
      renderStartupLog();
    });
    var lockupTravel = document.getElementById('lockup-travel');
    var linesEl = document.getElementById('lines');

    // Quitting takeover: shell.html is loaded with a `#quitting` hash when a
    // committed quit flips every window to this page. Seed the status line
    // before any IPC arrives so there's no empty flash.
    if (location.hash === '#quitting') {
      document.body.classList.add('quitting');
      statusLine.textContent = 'Quitting…';
    }

    // The intro

    var isIntroFinished = false;
    var introTimers = [];
    var introAnimations = [];

    // Tell the main process the film is over (or never ran), so it can land the
    // first route. Idempotent: the skip and the natural end can both reach here.
    function finishIntro() {
      if (isIntroFinished) return;
      isIntroFinished = true;
      introTimers.forEach(function(timer) { clearTimeout(timer); });
      introAnimations.forEach(function(animation) { animation.cancel(); });
      document.body.classList.remove('intro');
      document.body.classList.add('parked');
      if (window.mindsNative && window.mindsNative.introFinished) window.mindsNative.introFinished();
    }

    function buildLine(runs, lineSchedule) {
      var line = document.createElement('p');
      line.className = 'line';
      line.style.setProperty('--line-in-delay', lineSchedule.shownAt + 'ms');
      line.style.setProperty('--line-out-delay', lineSchedule.fadesOutAt + 'ms');
      runs.forEach(function(run) {
        var holder = run.em ? document.createElement('em') : document.createElement('span');
        holder.className = 'run';
        holder.textContent = run.text;
        line.appendChild(holder);
      });
      return line;
    }

    // The lockup's travel is measured rather than written in CSS: one end is a
    // width in cqw inside a flex column, the other a fixed 16px at the top of
    // the window, and Chrome does not interpolate a var()-derived transform in
    // a keyframe. The Web Animations API takes the measured numbers directly.
    function startLockupTravel(travelAt, travelMs) {
      // The parked geometry is declared once, on :root, and shared with the
      // #parked-mark rules.
      var rootStyle = getComputedStyle(document.documentElement);
      var parkedHeight = parseFloat(rootStyle.getPropertyValue('--parked-mark-height'));
      var titlebarHeight = parseFloat(rootStyle.getPropertyValue('--titlebar-height'));
      var parkedTop = (titlebarHeight - parkedHeight) / 2;
      var measure = function() {
        return [
          { transform: 'translateY(0) scale(1)' },
          {
            transform: 'translateY(' + (parkedTop - lockupTravel.offsetTop) + 'px) scale(' +
              (parkedHeight / lockupTravel.offsetHeight) + ')',
          },
        ];
      };
      var travel = lockupTravel.animate(measure(), {
        duration: travelMs,
        delay: travelAt,
        easing: 'cubic-bezier(0.76, 0, 0.24, 1)',
        fill: 'forwards',
      });
      introAnimations.push(travel);
      // A window resized mid-run moves the resting position; re-aim without
      // disturbing how far through the travel already is.
      window.addEventListener('resize', function() {
        if (travel.effect) travel.effect.setKeyframes(measure());
      });
    }

    function playIntro() {
      var introTiming = window.mindsIntroTiming;
      var timing = introTiming.INTRO_TIMING;
      var schedule = introTiming.computeIntroSchedule(timing, introTiming.INTRO_LINES);
      var rootStyle = document.documentElement.style;
      rootStyle.setProperty('--lockup-delay', timing.lockupDelayMs + 'ms');
      rootStyle.setProperty('--lockup-focus', timing.lockupFocusMs + 'ms');
      rootStyle.setProperty('--line-fade', timing.fadeMs + 'ms');
      rootStyle.setProperty('--line-ease', timing.fadeEase);
      rootStyle.setProperty('--em-blur', timing.emBlur);
      rootStyle.setProperty('--line-out', timing.outMs + 'ms');
      rootStyle.setProperty('--line-out-blur', timing.outBlur);
      document.body.classList.add('intro');
      introTiming.INTRO_LINES.forEach(function(runs, index) {
        linesEl.appendChild(buildLine(runs, schedule.lines[index]));
      });
      startLockupTravel(schedule.travelAt, timing.travelMs);
      introTimers.push(setTimeout(finishIntro, schedule.parkedAt));
      // A click or a key jumps straight to the parked state.
      document.addEventListener('click', finishIntro, { once: true });
      document.addEventListener('keydown', finishIntro, { once: true });
    }

    var isReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (location.hash === '#intro' && !isReducedMotion && window.mindsIntroTiming) {
      playIntro();
    } else {
      finishIntro();
    }

    // The error takeover

    // The latest error-details payload (message/details/actionLabel).
    var lastErrorData = null;

    document.getElementById('retry-btn').addEventListener('click', function() {
      if (window.mindsNative) window.mindsNative.retry();
    });
    document.getElementById('log-btn').addEventListener('click', function() {
      if (window.mindsNative) window.mindsNative.openLogFile();
    });

    var reportBtn = document.getElementById('report-btn');
    var reportResult = document.getElementById('report-result');
    var reportResultText = document.getElementById('report-result-text');
    var reportEventId = document.getElementById('report-event-id');
    var reportCopyBtn = document.getElementById('report-copy-btn');

    function showReportResult(text, eventId) {
      reportResultText.textContent = text;
      if (eventId) {
        reportEventId.textContent = eventId;
        reportEventId.style.display = '';
        reportCopyBtn.style.display = '';
      } else {
        reportEventId.textContent = '';
        reportEventId.style.display = 'none';
        reportCopyBtn.style.display = 'none';
      }
      reportResult.classList.add('visible');
    }

    reportCopyBtn.addEventListener('click', function() {
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(reportEventId.textContent);
        reportCopyBtn.textContent = 'Copied';
        setTimeout(function() { reportCopyBtn.textContent = 'Copy'; }, 1500);
      } catch (e) {
        /* ignore */
      }
    });

    reportBtn.addEventListener('click', function() {
      if (!window.mindsNative) return;
      // File a one-shot report of the on-screen error via the main-process
      // Sentry and surface the copyable event id.
      reportBtn.disabled = true;
      showReportResult('Sending report…', null);
      // Recent logs are always attached by the main-process report path.
      window.mindsNative.reportError().then(function(res) {
        if (res && res.ok && res.eventId) {
          showReportResult('Report sent. Reference ID:', res.eventId);
        } else {
          reportBtn.disabled = false;
          showReportResult('Could not send the report.', null);
        }
      }, function() {
        reportBtn.disabled = false;
        showReportResult('Could not send the report.', null);
      });
    });
    document.getElementById('toggle-details-btn').addEventListener('click', function() {
      var el = document.getElementById('error-details');
      el.classList.toggle('visible');
      this.textContent = el.classList.contains('visible') ? 'Hide details' : 'Show details';
    });

    if (window.mindsNative) {
      // Drives the status line under the bar: environment setup progress and
      // "Starting Mind..." while loading, "Stopping N workspaces…" while quitting.
      window.mindsNative.onStatusUpdate(function(message) {
        if (message) statusLine.textContent = message;
      });
      window.mindsNative.onStatusLogLine(function(line) {
        window.mindsStartupLog.appendStartupLogLine(startupLogLines, line);
        renderStartupLog();
      });
      window.mindsNative.onErrorDetails(function(data) {
        lastErrorData = data;
        // An error ends whatever the intro was doing: the takeover needs the
        // page, and the main process must not keep waiting on the film.
        finishIntro();
        // This page is reused (not reloaded) across takeovers, so clear any prior
        // report outcome and re-enable the button for the new error.
        reportResult.classList.remove('visible');
        reportBtn.disabled = false;
        document.body.classList.add('error');
        if (data.message) document.getElementById('error-message').textContent = data.message;
        if (data.details) document.getElementById('error-details').textContent = data.details;
        // Optional per-takeover label for the primary action (e.g. "Restart
        // Minds" for the discovery-pipeline takeover). Falls back to the static
        // "Retry" label for the generic backend-crash case. Always reassigned so
        // a label set by a prior takeover (this page is reused, not reloaded,
        // when the chrome view is already on shell.html) does not linger.
        document.getElementById('retry-btn').textContent = data.actionLabel || 'Retry';
      });
    }
  </script>
</body>
</html>
