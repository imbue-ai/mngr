<!DOCTYPE html>
<!--
  Window crash / failed-load error page.

  Loaded LOCALLY into the window by main.js in two cases:
    * the window's renderer process dies (render-process-gone) -- the whole
      window (titlebar, page, workspace iframe) is gone, so this page owns the
      full window with a centered message;
    * a top-level load failed after retries (did-fail-load, loaded with
      ?reason=load-failed) -- same surface, and the copy switches to a
      load-failure message.

  Runs under preload.js (the trusted first-party window.mindsNative bridge), so the
  Reload button drives the shell directly:
    * Reload -> window.mindsNative.reloadChrome() -> reload-chrome IPC (re-loads the
      failed URL when one is recorded, else /_chrome)

  Stateless: it does NOT auto-reload (if /_chrome is what crashed, that would loop)
  -- the user is the loop-breaker.
-->
<html>
<head>
  <meta charset="UTF-8">
  <title>Minds stopped responding</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Brand deep-maroon surface, matching the shell loading/error screens. */
    html, body { height: 100%; background: #492222; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #E9ECD9;
      user-select: none;
      /* The window's normal draggable titlebar died with the renderer, so the
         whole error surface drags; the button opts out below. */
      -webkit-app-region: drag;
    }
    .card {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 16px;
      font-size: 13px;
      text-align: center;
    }
    .msg { opacity: 0.9; }
    button {
      -webkit-app-region: no-drag;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: #E9ECD9;
      color: #492222;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    button:hover { background: #ffffff; }
  </style>
</head>
<body>
  <div class="card">
    <span class="msg" id="msg">This window stopped responding.</span>
    <button id="reload" type="button">Reload</button>
  </div>
  <script>
    // Failed-load callers pass ?reason=load-failed (see the header comment);
    // the default copy belongs to the renderer-crash case.
    if (new URLSearchParams(window.location.search).get('reason') === 'load-failed') {
      document.getElementById('msg').textContent = 'This screen failed to load.';
    }
    document.getElementById('reload').addEventListener('click', function () {
      if (window.mindsNative && window.mindsNative.reloadChrome) window.mindsNative.reloadChrome();
    });
  </script>
</body>
</html>
