# Which ToDesktop build each release channel serves.
#
# THIS FILE IS THE PROMOTION MECHANISM. Editing it and landing the PR is how a
# channel moves; CI publishes the manifests from it, and nothing else writes them.
#
# To promote:
#   1. Find the build id (the `build` job's summary in minds-launch-to-msg, or
#      the ToDesktop dashboard).
#   2. Edit the channel below.
#   3. For `stable` only, bump the `fallback_url` of
#      `_RELEASE_CHANNEL_PLATFORMS[_MAC_ARM64_PLATFORM]` in
#      `apps/remote_service_connector/imbue/remote_service_connector/accounts_web.py`
#      to the build being promoted: that URL is what the public download link
#      serves while the update feed is down.
#   4. Open a PR. CI dry-runs every gate against it, so review sees whether it
#      would actually publish.
#   5. Merge. CI publishes.
#
# Removing an entry withdraws nothing: no manifest is ever deleted, so the
# channel keeps serving its last build and the run reports that rather than a
# promotion. See scripts/release_channel/publish.py for the gates each entry has
# to pass, and the Release channels section of apps/minds/docs/deploy/ops/app-release.md
# for withdrawing a build.
#
# `rollout_percentage` is how much of the channel is offered the build. It is
# published as electron-updater's `stagingPercentage` key.
#
# Required on every entry: a manifest that declares none is rolled out to 100%.
#
# `platforms` lists which of ToDesktop's per-platform manifests the channel
# publishes for this build: `mac`, `linux`, or both. Required rather than
# defaulted, because every build ToDesktop made before Linux packaging landed
# carries a Linux manifest whose binaries cannot run there. When a
# Linux-capable build is promoted to alpha or beta, list it for
# `["mac", "linux"]`; stable stays `["mac"]` until the manual Linux pass in
# apps/minds/docs/deploy/next_deploy.md.

[channels.stable]
build_id = "260917ohslvgoyj"
version = "0.6.2"
fallback_branch = "minds-v0.6.2"
rollout_percentage = 100
platforms = ["mac"]

[channels.beta]
build_id = "260917ohslvgoyj"
version = "0.6.2"
fallback_branch = "minds-v0.6.2"
rollout_percentage = 100
platforms = ["mac"]

[channels.alpha]
build_id = "260922up2yn3io8"
version = "0.7.0"
fallback_branch = "minds-v0.7.0"
rollout_percentage = 100
platforms = ["mac", "linux"]

# Which default-workspace-template tag browser-created workspaces pin to, per
# channel. The hosted web chrome's create (the connector's POST /hosts/claim)
# leases a pool host baked at exactly this tag and has no rebuild fallback, so
# the pool must be baked at a tag BEFORE an entry names it
# (apps/minds/docs/deploy/ops/pool-hosts.md).
#
# Independent of the desktop entries above on purpose: the web client has no
# ToDesktop build, so a web-only template fix moves this pin ahead of (or
# behind) the desktop on its own. Published as `<channel>-web.json`; the
# connector reads it on every web create (cached about a minute), so moving the
# pin is a merge of this file, never a connector deploy. Which channel a web
# user is on is their own choice, in the web chrome's Settings (default
# stable). The publish refuses a tag that is not on the template remote.

[web_channels.stable]
template_ref = "minds-v0.7.0"

[web_channels.beta]
template_ref = "minds-v0.7.0"

[web_channels.alpha]
template_ref = "minds-v0.7.0"
