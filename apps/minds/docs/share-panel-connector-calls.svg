er, 2026-11-07. The replay issues the panel's own requests against the desktop backend run from source; main and this branch</text><text x="24.0" y="526.0" font-size="10" fill="#7c7a74" text-anchor="start" font-weight="normal">each on a fresh deployment of the connector, the two chosen because their unchanged routes ran within 2% of each other. A before bar</text><text x="24.0" y="539.0" font-size="10" fill="#7c7a74" text-anchor="start" font-weight="normal">averages two replays on its deployment and the tick spans them; an after bar is one replay. Flows chain the operations the panel makes.</text><text x="24.0" y="552.0" font-size="10" fill="#7c7a74" text-anchor="start" font-weight="normal">The unpublished open, unpublish, invite and readiness poll run unchanged code; their differences are the run-to-run noise.</text></svg>