# Per-token USD prices, keyed by the canonical "<provider>/<model>" pricing key.
#
# This table is ours. Most rows are synced from litellm's
# model_prices_and_context_window map by scripts/sync_litellm_prices.py, which a
# daily workflow runs and opens a PR from. A row litellm no longer carries keeps
# the rate it last agreed on: litellm prunes retired models from its catalog, and
# a provider dropping a model from a catalog is not the provider ceasing to bill
# for it. Costs here are derived at read time from stored token counts, so
# removing a row also un-prices every session already recorded under it.
#
# Four buckets per model, matching litellm's schema. cache_creation is the
# 5-minute-TTL cache-write rate, and is 0 for models that bill no cache-write
# surcharge.

["anthropic/claude-fable-5-1"]
input_cost_per_token = 1e-05
output_cost_per_token = 5e-05
cache_read_input_token_cost = 2.5e-07
cache_creation_input_token_cost = 1.25e-05

