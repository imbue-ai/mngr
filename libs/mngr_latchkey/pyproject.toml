[project]
name = "imbue-mngr-latchkey"
version = "0.1.6"
description = "Latchkey integration plugin for mngr - manages a shared latchkey gateway and per-agent permissions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbue-mngr==0.2.17",
    # Source of the bidirectional socket/channel relay used by the
    # reverse-tunnel paramiko handler; sharing the upstream copy keeps
    # the half-closed-channel fix in a single place.
    "imbue-mngr-forward==0.1.6",
    "imbue-common==0.1.20",
    "concurrency-group==0.1.20",
    "click>=8.0",
    "loguru>=0.7",
    "paramiko>=3.0",
    "pluggy>=1.0",
    "psutil>=5.9",
    # Cross-process read/write file lock; its read side is what lets a probe ask
    # who owns a latchkey directory without contending with another probe.
    "filelock>=3.31",
    # Renders the Debian package that provisions a remote host's gateway.
    "jinja2>=3.1",
    "pydantic>=2.0",
]

[project.entry-points.mngr]
latchkey = "imbue.mngr_latchkey.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The remote gateway package's source tree mirrors the Debian filesystem, so
# part of it sits under a ``usr/lib/`` that the repository's ``**/lib/`` ignore
# rule matches; ship it regardless (``remote/debian/.gitignore`` re-includes it
# for git). Declared for every build target rather than the wheel alone: the
# publish workflow builds the wheel from the sdist, so an sdist without these
# files would give a wheel without them.
[tool.hatch.build]
artifacts = ["imbue/mngr_latchkey/remote/debian/tree/usr/lib/**"]

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]
# ``.mjs`` files under ``imbue/mngr_latchkey/extensions/`` are picked up
# by hatchling's default file selection (the package dir is included
# verbatim modulo ``exclude``). The desktop extension set is materialized by
# ``Latchkey._spawn_gateway``; remote provisioning ships only the VPS proxy.

[tool.uv.sources]
imbue-mngr = { workspace = true }
imbue-mngr-forward = { workspace = true }
imbue-common = { workspace = true }
concurrency-group = { workspace = true }

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.12"
strict = ["**/*.py"]

[tool.pytest.ini_options]
timeout_func_only = true
pythonpath = ["."]
testpaths = ["."]
addopts = [
    "--cov=imbue.mngr_latchkey",
    "--cov-report=term-missing",
    "--timeout=30",
]

[tool.coverage.run]
source = ["imbue.mngr_latchkey"]
omit = [
    "*_test.py",
    "test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
