[project]
name = "imbue-mngr-docker"
version = "0.1.0"
description = "Docker provider backend plugin for mngr"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbue-mngr==0.2.17",
    # pinning docker because the guard registration module
    # (register_guards.py) monkeypatches its internal methods for test
    # resource guards; new versions may move or rename them.
    "docker==7.1.0",
    # requests is the transport docker-py is built on; we catch its connection
    # exceptions directly to tell "daemon unreachable" from "daemon errored".
    "requests>=2.26",
    "pydantic>=2.0",
    "pyinfra>=3.0",
    "tenacity>=8.0",
]

[project.entry-points.mngr]
docker = "imbue.mngr_docker.plugin"

[project.entry-points.resource_guards]
docker = "imbue.mngr_docker.register_guards:register_docker_guards"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.uv.sources]
imbue-mngr = { workspace = true }

[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.mngr_docker",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
  "--coverage-to-file",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
  # Requires a Docker daemon for integration testing
  "*/mngr_docker/instance.py",
  "*/mngr_docker/volume.py",
  "*/mngr_docker/leaked_container_sweep.py",
  "*/mngr_docker/testing.py",
]

[tool.coverage.report]
fail_under = 65
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
  "*/mngr_docker/instance.py",
  "*/mngr_docker/volume.py",
  "*/mngr_docker/leaked_container_sweep.py",
  "*/mngr_docker/testing.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.12"
strict = ["**/*.py"]
