[project]
name = "imbue-mngr-autocompact"
version = "0.1.0"
description = "Auto-compaction plugin for mngr - proactive and on-prompt context compaction for conversational agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbue-mngr==0.2.17",
]

[project.entry-points.mngr]
autocompact = "imbue.mngr_autocompact.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.uv.sources]
imbue-mngr = { workspace = true }

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.12"
strict = ["**/*.py"]

[tool.pytest.ini_options]
timeout_func_only = true
pythonpath = ["."]
testpaths = ["."]
addopts = [
    "--cov=imbue.mngr_autocompact",
    "--cov-report=term-missing",
    "--timeout=30",
]

[tool.coverage.run]
source = ["imbue.mngr_autocompact"]
omit = [
    "*_test.py",
    "test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
